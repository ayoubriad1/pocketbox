# One-command environment INCLUDING fpocket.
#   conda env create -f environment.yml
#   conda activate pocketbox
#   streamlit run app.py
name: pocketbox
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - fpocket
  - rdkit
  - numpy
  - pip
  # P2Rank (optional second detector) is not a conda package; if you want it,
  # install a JRE and drop the standalone P2Rank distribution on PATH.
  - pip:
      - streamlit>=1.30
      - py3Dmol>=2.0
