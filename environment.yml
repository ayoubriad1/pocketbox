# One-command environment INCLUDING fpocket.
#   conda env create -f environment.yml
#   conda activate pocketbox
#   streamlit run app.py
name: pocketbox
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - fpocket
  - p2rank          # optional second detector (Java-based); pulls openjdk
  - openjdk
  - rdkit
  - numpy
  - pip
  - pip:
      - streamlit>=1.30
      - py3Dmol>=2.0
      - stmol>=0.0.9
